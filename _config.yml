# Jekyll site configuration
title                    : "Yukun Chen | 陈煜坤"
description              : "Silicon photonics · Computational spectroscopy · Optical interconnects"
repository               : "chenykfrank/chenykfrank.github.io"
google_scholar_stats_use_cdn : false

# Search verification (existing site ownership)
google_analytics_id      :
google_site_verification : fQZQD0EwLaSOrp3EbALt2rjxHEY9pUvWuh1fS96xgNk
bing_site_verification   : 56D1B3DBCF345410DA9431AFE01788E7
baidu_site_verification  :

author:
  name             : "Yukun Chen · 陈煜坤"
  avatar           : "https://avatars.githubusercontent.com/u/55609970?v=4"
  bio              : "Photonics · Optical sensing · Optical interconnects"
  location         : "Shanghai, China"
  email            : "chenykfrank@outlook.com"
  github           : "chenykfrank"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
